name: Master release builds

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: master-release-${{ github.sha }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.18.0
  NODE_VERSION: 22.13.0

jobs:
  release:
    name: Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            asset_os: linux
            asset_arch: x64
            args: ""
          - name: Windows
            os: windows-latest
            asset_os: windows
            asset_arch: x64
            args: ""
          - name: macOS Intel
            os: macos-15-intel
            asset_os: macos
            asset_arch: x64
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-latest
            asset_os: macos
            asset_arch: arm64
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ startsWith(matrix.name, 'macOS') && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish prerelease
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: build-${{ github.run_number }}-${{ github.sha }}
          releaseName: EasyTrim Editor build ${{ github.run_number }}
          releaseBody: |
            Automated prerelease for commit ${{ github.sha }}.

            This build is generated from `master` and is intended for validation, not stable distribution.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: false
          releaseAssetNamePattern: EasyTrim_[version]_${{ matrix.asset_os }}_${{ matrix.asset_arch }}_[bundle][ext]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
